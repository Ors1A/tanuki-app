<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B2F">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Cardápio de Verão - Tanuki Ramen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF5EA;--ink:#1E2B2F;--muted:#55625F;--accent:#B84E14;--accent-bg:#FCEBDD;--sand:#F1E8D5;--card:#FFFDF7;--line:#EADFC8;--line2:#CFC3A8;--peach:#F4C095;--err:#A12B1B;--ok:#2F7A4F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',Arial,sans-serif;font-size:17px;line-height:1.4;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Fredoka',Arial,sans-serif;margin:0;line-height:1.1}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hero img{display:block;width:100%;height:auto}
.intro{background:var(--ink);color:var(--bg);padding:18px 16px 22px}
.intro h1{font-size:32px;font-weight:600}
.intro p{margin:8px 0 0;color:#C9D3CF;font-size:15px}
.intro b{color:var(--peach)}
.topo{display:flex;justify-content:space-between;align-items:center;margin:20px 0 4px;gap:8px}
.topo h2{font-size:30px;font-weight:600}
.link{font:inherit;font-weight:700;font-size:15px;background:none;border:0;padding:8px 2px;cursor:pointer;color:var(--muted)}
.link.rem{color:var(--err)}
.sub{color:var(--muted);font-size:15px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}
label.campo{display:block;font-weight:700;font-size:15px;margin:0 0 6px}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line2);border-radius:14px;padding:14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.campo-grupo{margin-bottom:14px}
.campo-grupo:last-child{margin-bottom:0}
.erro-campo{color:var(--err);font-size:14px;font-weight:600;margin-top:5px;display:none}
.tem-erro .erro-campo{display:block}
.tem-erro input{border-color:var(--err)}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 auto;min-width:100px;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line2);background:var(--card);border-radius:14px;font-weight:600;font-size:16px;cursor:pointer;user-select:none;text-align:left;font-family:inherit;color:var(--ink)}
.chip .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #8A9490;background:#fff}
.chip.check .dot{border-radius:6px}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-bg)}
.chip[aria-pressed=true] .dot{border-color:var(--accent);background:var(--accent)}
.chip small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.chip .t{flex:1}
.sec{font-weight:700;font-size:15px;margin:16px 0 8px}
.sec:first-child{margin-top:0}
.sec small{font-weight:600;color:var(--muted)}
.nota{font-size:14px;color:var(--muted);margin:8px 0 0}
.passo{display:flex;align-items:center;gap:14px}
.passo button{width:48px;height:48px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent);font-size:28px;font-weight:700;line-height:1;cursor:pointer;font-family:inherit}
.passo button[disabled]{opacity:.35}
.passo output{min-width:34px;text-align:center;font-family:'Fredoka',Arial,sans-serif;font-size:30px;font-weight:600}
.linha{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.linha:last-child{border-bottom:0}
.linha .t{flex:1;font-weight:600;font-size:16px}
.linha small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.linha.on .t{color:var(--accent)}
.passo.mini{gap:8px}
.passo.mini button{width:40px;height:40px;font-size:24px}
.passo.mini output{min-width:24px;font-size:24px}
.base{background:var(--sand);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);margin-top:12px}
.acoes{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.acoes .tit{font-weight:700;font-size:15px;color:var(--muted)}
.btn{font:inherit;font-weight:700;font-size:18px;border-radius:14px;padding:15px 18px;cursor:pointer;text-align:center;text-decoration:none;display:block;width:100%}
.btn.prim{color:#fff;background:var(--accent);border:2px solid var(--accent)}
.btn.sec2{color:var(--accent);background:transparent;border:2px solid var(--accent)}
.btn.escuro{color:var(--ink);background:var(--peach);border:2px solid var(--peach)}
.btn[disabled]{opacity:.55}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.avisos{background:var(--sand);border-radius:16px;padding:16px;font-size:15px;margin-top:12px}
.avisos ul{margin:8px 0 0;padding-left:20px}
.ciente{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-weight:700;cursor:pointer}
.ciente input{width:24px;height:24px;accent-color:var(--accent);flex:none;margin-top:1px}
.msg{border-radius:20px;padding:22px;margin-top:22px}
.msg h2{font-size:30px;font-weight:600;margin-bottom:8px}
.msg.ok{background:var(--card);border:2px solid var(--ok)}
.msg.aviso{background:var(--sand);border:1px solid var(--line2)}
.msg.falha{background:#FBE9E5;border:2px solid var(--err)}
.resumo{margin:12px 0 0;padding:0;list-style:none;font-size:16px}
.resumo li{padding:7px 0;border-bottom:1px solid var(--line)}
.resumo li:last-child{border-bottom:0}
.num{font-family:'Fredoka',Arial,sans-serif;font-size:20px;color:var(--ok);font-weight:600;margin-bottom:6px}
.valor{font-family:'Fredoka',Arial,sans-serif;font-size:40px;color:var(--accent);font-weight:600;margin:10px 0 0}
.pix{background:var(--sand);border-radius:16px;padding:16px;margin-top:16px}
.pix textarea{font-size:13px;word-break:break-all;background:#fff}
.carregando{padding:40px 0;text-align:center;color:var(--muted)}
.passos{display:flex;gap:6px;margin-top:16px}
.passos i{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.passos i.on{background:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="hero"><img src="banner.jpg" alt="Tanuki Ramen - Verão no Havaí" width="1200" height="300"></div>
  <div class="intro"><div class="wrap" style="padding:0">
    <h1>Cardápio de Verão</h1>
    <p>Onigiri e Poke do Tanuki Ramen.<span id="retirada-topo"></span></p>
  </div></div>
</header>
<main class="wrap"><div id="carregando" class="carregando">Carregando…</div><div id="tela" hidden></div></main>

<script>
/* ========= CONFIGURAÇÃO (única parte para editar) ========= */
var CFG = {
  // Sistema novo (serviço "Tanuki - Sistema novo (servico)", cobrança pelo PicPay). RASCUNHO: ainda não publicado.
  API_URL: 'https://script.google.com/macros/s/AKfycbx2KKFl2p3aC6wfNwr5xXJqieUsOegznbeyn7Uz33JJuPd4YkLKkL0HBnUUtYMUUsE7/exec',
  FORMS_URL: 'https://docs.google.com/forms/d/e/1FAIpQLSdhe-UDoFvFDKVo3W6qhrBZdojULVRSAbPEYKPa4W9TVk6k5w/viewform',
  FORMS_ORIGEM_ENTRY: 'entry.1429552709',
  // Pix copia e cola. Enquanto "chave" estiver vazia, a tela de confirmação mostra só
  // "Entraremos em contato para o pagamento". titular = nome como aparece no app do banco.
  PIX: { chave: '56064358000132', titular: 'Arthur Orsi Consultoria', cidade: 'SAO MIGUEL DO OESTE' },
  WHATSAPP: '5549998120435',   // número que recebe o comprovante, só dígitos com 55 + DDD, ex.: 5549999999999
  // Aberto/fechado, leva e PREÇOS vêm da planilha (serviço ?acao=cardapio), a cada abertura da página.
  // Aqui ficam só os textos e os nomes oficiais da aba Produtos (têm que bater com ST no serviço).
  // Item que não estiver ativo na planilha some da página.
  MAX_POKES: 5, MAX_ONI_PAGINAS: 3, MAX_ONIGIRI: 10,
  NOMES: {
    SABORES: { salmao: 'Poke Salmao', apimentado: 'Poke Apimentado (atum)', vegetariano: 'Poke Vegetariano' },
    ONIGIRIS: { salmao: 'Onigiri Salmao', tuna: 'Onigiri Tuna Mayo', shimeji: 'Onigiri Shimeji' },
    ACOMP: { sunomono: 'Sunomono', repolho: 'Mix de Repolho com Goma Dare' },
    SOBREMESAS: { pudim: 'Pudim de Matcha' },
    ADICIONAIS: {
      salmao: 'Salmao marinado', atum: 'Atum cozido com maionese', shimejitofu: 'Shimeji + Tofu',
      tofu: 'Tofu marinado', shimeji: 'Shimeji', arroz: 'Arroz extra', sunomono: 'Sunomono',
      repolho: 'Mix de Repolho com Goma Dare', gomadare: 'Goma dare (molho de gergelim)', manga: 'Manga',
      cenoura: 'Cenoura', kani: 'Kani (nao vegetariano)', palmito: 'Palmito pupunha', castanha: 'Castanha de caju',
      creamcheese: 'Cream cheese', gari: 'Gari (gengibre em conserva)', nori: 'Nori', avocado: 'Avocado',
      ajitama: 'Ajitama (ovo marinado, nao vegetariano)'
    }
  },
  SABORES: [
    {k:'salmao', nome:'Salmão', desc:'Salmão cru marinado no shoyu e gergelim', peso:'~435 g'},
    {k:'apimentado', nome:'Apimentado', desc:'Atum na maionese japonesa com sriracha da casa', peso:'~425 g'},
    {k:'vegetariano', nome:'Vegetariano', desc:'Tofu e shimeji marinados, com ervilhas', peso:'~470 g'}
  ],
  BASE_POKE: 'Todos levam arroz de sushi 150 g, 120 g de proteína, sunomono (pepino), Gari - Gengibre em Conserva, cebolinha, gergelim, furikake e maionese japonesa. Molhos vão em pote separado. Pesos aproximados, sem o pote.',
  // max: quantas porções por poke (1 = marca/desmarca). prot: aparece em "Proteínas extras".
  ADICIONAIS: [
    {k:'salmao', nome:'Salmão marinado', por:'50 g', p:10.9, max:3, prot:true},
    {k:'atum', nome:'Atum cozido com Maionese e Sriracha', por:'50 g', p:10.9, max:3, prot:true},
    {k:'shimejitofu', nome:'Shimeji + Tofu', por:'50 g', p:10.9, max:3, prot:true},
    {k:'tofu', nome:'Tofu marinado', por:'40 g', p:4.9, max:1},
    {k:'shimeji', nome:'Shimeji', por:'40 g', p:7, max:1},
    {k:'arroz', nome:'Arroz extra', por:'50 g', p:2.9, max:3},
    {k:'sunomono', nome:'Sunomono', por:'50 g', p:1.5, max:3},
    {k:'repolho', nome:'Mix de Repolho com Goma Darê (Molho de Gergelim)', por:'50 g', p:1.9, max:3},
    {k:'gomadare', nome:'Goma darê - Molho de gergelim', por:'10 g', p:0.9, max:1},
    {k:'manga', nome:'Manga', por:'35 g', p:3, max:1},
    {k:'cenoura', nome:'Cenoura', por:'30 g', p:3, max:1},
    {k:'kani', nome:'Kani', por:'40 g', p:6, max:1},
    {k:'palmito', nome:'Palmito pupunha', por:'40 g', p:5, max:1},
    {k:'castanha', nome:'Castanha de caju', por:'15 g', p:4, max:1},
    {k:'creamcheese', nome:'Cream cheese', por:'25 g', p:4, max:1},
    {k:'gari', nome:'Gari - Gengibre em Conserva', por:'12 g', p:2.5, max:1},
    {k:'nori', nome:'Nori', por:'¼ de folha', p:2, max:1},
    {k:'avocado', nome:'Avocado', por:'45 g', p:5, max:1},
    {k:'ajitama', nome:'Ajitama (ovo marinado)', por:'1 un', p:4, max:1}
  ],
  ONIGIRIS: [
    {k:'salmao', nome:'Salmão', desc:'Salmão cru, cream cheese e cebolinha'},
    {k:'tuna', nome:'Tuna Mayo', desc:'Atum com maionese japonesa'},
    {k:'shimeji', nome:'Shimeji (vegetariano)', desc:'Contém castanha de caju e leite'}
  ],
  // Acompanhamentos do onigiri (só aparecem se o pedido tiver onigiri)
  ACOMP: [
    {k:'sunomono', nome:'Sunomono', por:'50 g', p:1.5, max:3},
    {k:'repolho', nome:'Mix de Repolho com Goma Darê (Molho de Gergelim)', por:'50 g', p:1.9, max:3}
  ],
  SOBREMESAS: [
    {k:'pudim', nome:'Pudim de matcha', por:'150 g', p:10, max:5}
  ],
  AVISOS: [
    'Salmão cru: consumir preferencialmente no dia da retirada. Conservar a 8 °C ou menos por até 2 dias.',
    'Onigiri de shimeji: contém castanha de caju e leite.',
    'Kani e ajitama não são vegetarianos.',
    'Leve o pedido direto para a geladeira depois da retirada.'
  ]
};
/* =========================================================== */

(function(){
  var $ = function(id){ return document.getElementById(id); };
  var origem = (new URLSearchParams(location.search).get('origem') || 'pagina').replace(/[^A-Za-z0-9_-]/g,'').slice(0,30) || 'pagina';
  var formsLink = CFG.FORMS_URL + '?usp=pp_url&' + CFG.FORMS_ORIGEM_ENTRY + '=' + encodeURIComponent(origem);

  var dados = {nome:'', tel:'', obs:'', ciente:false};
  var units = [];          // {t:'poke', sabor, vin, ad:{chave: qtd}} | {t:'oni', sabor, qtd}
  var extras = {acomp:{}, sob:{}};   // acompanhamentos do onigiri e sobremesas: {chave: qtd}
  // Telas: 'dados' | 'u<i>a' (poke: sabor) | 'u<i>b' (poke: adicionais) | 'u<i>' (onigiri) | 'acomp' | 'sob' | 'final'
  var tela = 'dados';
  var enviando = false;
  // Modo complemento: {ref, tel, info} depois de achar o pedido (número + telefone). null = pedido novo.
  var modo = null, idComp = null, ultimaRes = null;
  var pendRef = '', substituiRef = '';   // pedido ainda não pago do mesmo telefone / pedido que o novo vai substituir
  var retirada = '';   // texto da retirada, da aba Configuração (via ?acao=cardapio)
  function frase(){ return retirada ? 'Retirada: <b>' + esc(retirada) + '</b>.' : 'Combinaremos a retirada com você pelo WhatsApp.'; }
  var refPre = (new URLSearchParams(location.search).get('complemento') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  var idPedido = null;
  try { idPedido = sessionStorage.getItem('tanuki_id_pedido'); } catch(e){}
  if (!idPedido) {
    idPedido = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('p' + Date.now() + Math.random().toString(36).slice(2));
    try { sessionStorage.setItem('tanuki_id_pedido', idPedido); } catch(e){}
  }

  function brl(n){ return 'R$ ' + n.toFixed(2).replace('.', ','); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function precoDe(lista, k){ var r = lista.filter(function(x){ return x.k === k; })[0]; return r ? r.p : 0; }
  // "Poke R$ 55,00" (ou "a partir de R$ 55,00" se os sabores tiverem preços diferentes)
  function textoPreco(lista, rotulo){
    var ps = lista.map(function(x){ return x.p; }), min = Math.min.apply(null, ps), max = Math.max.apply(null, ps);
    return rotulo + (min === max ? ' ' : ' a partir de ') + brl(min);
  }
  function nomeSabor(lista, k){ var r = lista.filter(function(x){ return x.k === k; })[0]; return r ? r.nome : ''; }
  function contar(t){ return units.filter(function(u){ return u.t === t; }).length; }
  function numero(i){ var t = units[i].t, n = 0; for (var j = 0; j <= i; j++) if (units[j].t === t) n++; return n; }
  function titulo(i){ return (units[i].t === 'poke' ? 'Poke ' : 'Onigiri ') + numero(i); }
  function linkForms(txt){ return '<a class="btn prim" style="margin-top:14px" href="' + esc(formsLink) + '">' + txt + '</a>'; }
  function ir(t){ tela = t; render(); window.scrollTo({top: document.querySelector('.intro').offsetTop, behavior: 'smooth'}); }
  function unidadeDe(t){ var m = /^u(\d+)/.exec(String(t)); return m ? +m[1] : -1; }
  function primeiraTela(i){ return units[i].t === 'poke' ? 'u' + i + 'a' : 'u' + i; }
  function passos(){
    var p = [modo ? 'comp' : 'dados'];
    units.forEach(function(u, i){ if (u.t === 'poke') p.push('u' + i + 'a', 'u' + i + 'b'); else p.push('u' + i); });
    if (contar('oni')) p.push('acomp');
    p.push('sob', 'final');
    return p;
  }
  function depoisDosItens(){ return contar('oni') ? 'acomp' : 'sob'; }
  // Linha com − número + (quantidade de 0 a max)
  function passoQtd(g, k, nome, sub, q, max){
    return '<div class="linha' + (q ? ' on' : '') + '"><span class="t">' + esc(nome) + '<small>' + sub + '</small></span><div class="passo mini">' +
      '<button data-a="q" data-g="' + g + '" data-k="' + k + '" data-d="-1"' + (q <= 0 ? ' disabled' : '') + ' aria-label="Menos ' + esc(nome) + '">−</button><output>' + q + '</output>' +
      '<button data-a="q" data-g="' + g + '" data-k="' + k + '" data-d="1"' + (q >= max ? ' disabled' : '') + ' aria-label="Mais ' + esc(nome) + '">+</button></div></div>';
  }

  /* ---------- estado geral ---------- */
  function mostrarEstado(html, cls){
    $('carregando').hidden = true;
    var e = $('tela'); e.hidden = false;
    e.innerHTML = '<div class="msg ' + (cls || 'aviso') + '">' + html + '</div>';
  }

  // Aplica o cardápio da planilha: preço de cada item e remove o que não está ativo.
  function aplicarCardapio(j){
    var preco = {};
    j.itens.forEach(function(it){ preco[it.nome] = Number(it.preco); });
    function aplica(lista, nomes){
      return lista.filter(function(x){ return nomes[x.k] && preco.hasOwnProperty(nomes[x.k]); })
                  .map(function(x){ x.p = preco[nomes[x.k]]; return x; });
    }
    CFG.SABORES = aplica(CFG.SABORES, CFG.NOMES.SABORES);
    CFG.ONIGIRIS = aplica(CFG.ONIGIRIS, CFG.NOMES.ONIGIRIS);
    CFG.ACOMP = aplica(CFG.ACOMP, CFG.NOMES.ACOMP);
    CFG.SOBREMESAS = aplica(CFG.SOBREMESAS, CFG.NOMES.SOBREMESAS);
    CFG.ADICIONAIS = aplica(CFG.ADICIONAIS, CFG.NOMES.ADICIONAIS);
  }

  function carregar(){
    // Quem manda é a planilha: o serviço devolve se a leva está aberta e os itens ativos com preço.
    // Sem cardápio não abrimos a página (evita mostrar preço velho).
    var decidido = false;
    function falhou(){
      if (decidido) return; decidido = true;
      mostrarEstado('<h2>Não conseguimos carregar o cardápio</h2><p>Tente de novo em instantes.</p><button class="btn prim" style="margin-top:14px" onclick="location.reload()">Tentar de novo</button>' +
        '<p class="nota" style="margin-top:14px">Se continuar assim, fale com a gente no WhatsApp.</p>', 'falha');
    }
    var limite = setTimeout(falhou, 15000);   // primeira chamada do Google pode demorar
    try {
      fetch(CFG.API_URL + '?acao=cardapio').then(function(r){ return r.json(); }).then(function(j){
        if (decidido) return;
        clearTimeout(limite);
        if (!j || j.ok !== true || !Array.isArray(j.itens)) { falhou(); return; }
        decidido = true;
        if (j.aberto === false) {
          mostrarEstado('<h2>Pedidos encerrados</h2><p>No momento não estamos aceitando pedidos. Fique de olho no nosso Instagram para a próxima rodada! 🙏</p>');
          return;
        }
        aplicarCardapio(j);
        retirada = String(j.retirada || '');
        if (retirada && $('retirada-topo')) $('retirada-topo').innerHTML = '<br>📍 Retirada: ' + esc(retirada) + '.';
        if (refPre) tela = 'acesso';
        $('carregando').hidden = true; $('tela').hidden = false; render();
      }).catch(function(){ clearTimeout(limite); falhou(); });
    } catch(e){ clearTimeout(limite); falhou(); }
  }

  /* ---------- telas ---------- */
  function render(){
    var el = $('tela');
    if (tela === 'dados') el.innerHTML = htmlDados();
    else if (tela === 'acesso') el.innerHTML = htmlAcesso();
    else if (tela === 'comp') el.innerHTML = htmlComp();
    else if (tela === 'final') el.innerHTML = htmlFinal();
    else if (tela === 'acomp') el.innerHTML = htmlAcomp();
    else if (tela === 'sob') el.innerHTML = htmlSobremesa();
    else el.innerHTML = htmlUnidade(tela);
  }

  function barra(){
    var p = passos(), at = p.indexOf(tela), h = '<div class="passos">';
    for (var i = 0; i < p.length; i++) h += '<i class="' + (i <= at ? 'on' : '') + '"></i>';
    return h + '</div>';
  }

  function htmlDados(){
    var h = '<div class="topo"><h2>Seus dados</h2></div>';

  // Total do pedido, só para mostrar na tela "Quase lá". Quem vale é o total do serviço (validar_).
  function totalPedido(){
    var t = 0;
    units.forEach(function(u){
      if (u.t === 'poke') {
        t += precoDe(CFG.SABORES, u.sabor);
        CFG.ADICIONAIS.forEach(function(a){ if (u.ad[a.k]) t += a.p * u.ad[a.k]; });
      } else {
        t += u.qtd * precoDe(CFG.ONIGIRIS, u.sabor);
      }
    });
    if (contar('oni')) CFG.ACOMP.forEach(function(a){ t += a.p * (extras.acomp[a.k] || 0); });
    CFG.SOBREMESAS.forEach(function(s){ t += s.p * (extras.sob[s.k] || 0); });
    return Math.round(t * 100) / 100;
  }

  /* ---------- validação ---------- */
  // Mesmas regras do serviço (servico-pedido-verao.gs): tira +55 e o 0 de longa distância; DDD válido;
  // celular com 9 na frente; fixo de 2 a 5; não pode ser tudo igual.
  function digitosTel(v){ var d = String(v).replace(/\D/g,''); if (d.length >= 12 && d.indexOf('55') === 0) d = d.slice(2); if (d.charAt(0) === '0') d = d.slice(1); return d; }
  function foneOk(v){
    var d = digitosTel(v);
    if (!/^[1-9][1-9]\d{8,9}$/.test(d)) return false;
    if (d.length === 11 && d.charAt(2) !== '9') return false;
    if (d.length === 10 && !/[2-5]/.test(d.charAt(2))) return false;
    return !/^(\d)\1+$/.test(d.slice(-8));
  }
  var NOME_OK = /^[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ'’´.\- ]{2,79}$/;
  function nomeOk(v){ var n = String(v).normalize('NFC').trim().replace(/\s+/g,' '); return NOME_OK.test(n) && n.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g,'').length >= 3; }
  function lerDados(){
    if ($('nome')) dados.nome = $('nome').value;
    if ($('tel')) dados.tel = $('tel').value;
    if ($('obs')) dados.obs = $('obs').value;
    if ($('ciente')) dados.ciente = $('ciente').checked;
  }
  function dadosOk(){
    var n = nomeOk(dados.nome), t = foneOk(dados.tel);
    return {nome: n, tel: t, ok: n && t};
  }
  function unidadeOk(u){
    if (!u.sabor) return false;
    if (u.t === 'poke' && u.vin !== true && u.vin !== false) return false;
    return true;
  }
  function mostrarErrosUnidade(u){
    var s = $('e-sabor'), v = $('e-vin');
    if (s) s.style.display = u.sabor ? 'none' : 'block';
    if (v) v.style.display = (u.t === 'poke' && u.vin === null) ? 'block' : 'none';
    var alvo = !u.sabor ? $('s-sabor') : (u.t === 'poke' && u.vin === null ? v : null);
    if (alvo) alvo.scrollIntoView({behavior:'smooth', block:'center'});
  }
  function primeiraInvalida(){
    for (var i = 0; i < units.length; i++) if (!unidadeOk(units[i])) return i;
    return -1;
  }
  function totaisOni(){
    var t = {}; CFG.ONIGIRIS.forEach(function(o){ t[o.k] = 0; });
    units.forEach(function(u){ if (u.t === 'oni' && u.sabor) t[u.sabor] += u.qtd; });
    return t;
  }

  function soPositivos(o){ var r = {}; for (var k in o) if (o[k] > 0) r[k] = o[k]; return r; }

  /* ---------- ações ---------- */
  function novaUnidade(t){
    units.push(t === 'poke' ? {t:'poke', sabor:null, vin:null, ad:{}} : {t:'oni', sabor:null, qtd:1});
    ir(primeiraTela(units.length - 1));
  }
  function linkWhats(txt, msg){
    if (!CFG.WHATSAPP) return '';
    return '<a class="btn sec2" style="margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/' + CFG.WHATSAPP + '?text=' + encodeURIComponent(msg) + '">' + txt + '</a>';
  }
  // Consulta o pedido (número + telefone). Em caso de sucesso entra no modo complemento.
  function consultarPedido(ref, tel, erro){
    var ctl = new AbortController(), t = setTimeout(function(){ ctl.abort(); }, 30000);
    fetch(CFG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({acao:'consultar', ref: ref, telefone: tel}), signal: ctl.signal})
      .then(function(r){ return r.json(); })
      .then(function(j){
        clearTimeout(t); enviando = false;
        if (j && j.ok === true && j.pendente) { dados.tel = tel; pendente({pendente: {ref: j.ref, total: j.total, data: ''}}); return; }
        if (j && j.ok === true) {
          modo = {ref: j.ref, tel: tel, info: j};
          idComp = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('c' + Date.now() + Math.random().toString(36).slice(2));
          ir('comp');
        } else erro((j && j.mensagem) || 'Não encontramos esse pedido. Confira o número e o telefone.');
      })
      .catch(function(){ clearTimeout(t); enviando = false; erro('Não conseguimos consultar agora. Tente de novo.'); });
  }
  // Devolve ao formulário o que o cliente tinha escolhido (vem do serviço, nos mesmos nomes que a página usa).
  function carregarCorpo(c){
    c = c || {};
    units = [];
    (c.pokes || []).forEach(function(b){ units.push({t:'poke', sabor:b.sabor, vin:b.vinagrete === true, ad: soPositivos(b.adicionais || {})}); });
    var on = c.onigiris || {};
    Object.keys(on).forEach(function(k){ if (on[k] > 0) units.push({t:'oni', sabor:k, qtd:+on[k]}); });
    extras = {acomp: soPositivos(c.acompanhamentos || {}), sob: soPositivos(c.sobremesas || {})};
    dados.nome = c.nome || dados.nome; dados.tel = c.telefone || dados.tel; dados.obs = c.obs || ''; dados.ciente = false;
    modo = null;
    idPedido = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('p' + Date.now() + Math.random().toString(36).slice(2));
    try { sessionStorage.setItem('tanuki_id_pedido', idPedido); } catch(e){}
  }
  function retomarServico(ref, tel, ok){
    enviando = true;
    var ctl = new AbortController(), t = setTimeout(function(){ ctl.abort(); }, 40000);
    fetch(CFG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({acao:'retomar', ref: ref, telefone: tel}), signal: ctl.signal})
      .then(function(r){ return r.json(); })
      .then(function(j){
        clearTimeout(t); enviando = false;
        if (j && j.ok === true) ok(j); else alert((j && j.mensagem) || 'Não foi possível voltar ao pagamento agora.');
      })
      .catch(function(){ clearTimeout(t); enviando = false; alert('Não conseguimos agora. Tente de novo.'); });
  }
  // Há um pedido do mesmo telefone que ainda não foi pago: voltar ao pagamento, alterar ou fazer outro.
  function pendente(j){
    enviando = false;
    pendRef = j.pendente.ref;
    $('tela').innerHTML = '<div class="msg aviso"><h2>Você tem um pedido aguardando pagamento</h2><p>Encontramos um pedido de <b>' + brl(Number(j.pendente.total)) + '</b>' + (j.pendente.data ? ' feito em ' + esc(j.pendente.data) : '') + ' que ainda não foi pago. Ele só é registrado depois do pagamento. O que você quer fazer?</p>' +
      '<button class="btn prim" style="margin-top:14px" data-a="retomarpag">Voltar ao pagamento</button>' +
      '<button class="btn sec2" style="margin-top:10px" data-a="retomaralt">Alterar esse pedido</button>' +
      (ultimoCorpo ? '<button class="btn sec2" style="margin-top:10px" data-a="outro">Fazer outro pedido mesmo assim</button>' : '') + '</div>';
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
  // Já existe pedido no mesmo nome ou telefone: pede confirmação antes de gravar um segundo pedido.
  function existente(j){
    enviando = false;
    $('tela').innerHTML = '<div class="msg aviso"><h2>Já existe um pedido</h2><p>Já existe um pedido em nome de <b>' + esc(dados.nome.trim()) + '</b> para <b>' + esc((j.existente && j.existente.data) || '') + '</b>. Você está ciente disso e quer fazer um <b>segundo pedido</b>?</p>' +
      '<button class="btn prim" style="margin-top:14px" data-a="segundo">Sim, quero fazer outro pedido</button>' +
      '<button class="btn sec2" style="margin-top:10px" data-a="tentar">Não, voltar</button>' +
      '<p class="nota" style="margin-top:14px">Quer só acrescentar itens ao pedido que já fez? <button class="link" data-a="acessar">Ver ou adicionar itens</button></p></div>';
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
  function falhaEnvio(incerto){
    enviando = false;
    var h;
    if (incerto) {
      // Pode ter sido gravado: NÃO deixar editar nem mandar pelo Google Forms (viraria pedido duplicado).
      // "Tentar de novo" reenvia exatamente o mesmo pedido; o serviço devolve o mesmo resultado se já tiver gravado.
      h = '<h2>Sem resposta do sistema</h2><p>Não recebemos a confirmação, então seu pedido <b>pode ou não ter sido registrado</b>. Toque em <b>Tentar de novo</b>: se ele já tiver entrado, aparece a confirmação, sem duplicar.</p>' +
        '<button class="btn prim" style="margin-top:14px" data-a="reenviar">Tentar de novo</button>' +
        linkWhats('Falar com a gente no WhatsApp', 'Olá! Tentei fazer um pedido pela página e não recebi a confirmação. Nome: ' + dados.nome.trim() + '.');
    } else {
      h = '<h2>Não conseguimos enviar por aqui</h2><p>Seu pedido <b>ainda não foi registrado</b>. Faça o pedido pelo formulário do Google, que funciona igual:</p>' +
        linkForms('Fazer pedido pelo formulário') + '<button class="btn sec2" style="margin-top:10px" data-a="tentar">Voltar e tentar de novo</button>';
    }
    $('tela').innerHTML = '<div class="msg falha">' + h + '</div>';
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
  // Pedido recusado pelo limite por telefone/nome ou por conflito com um pedido já enviado.
  function recusado(msg){
    enviando = false;
    $('tela').innerHTML = '<div class="msg aviso"><h2>' + (modo ? 'Não foi possível adicionar' : 'Já temos um pedido seu') + '</h2><p>' + esc(msg) + '</p>' +
      linkWhats('Falar com a gente no WhatsApp', modo ? 'Olá! Quero alterar o pedido ' + modo.ref + '.' : 'Olá! Já fiz um pedido e quero alterar. Nome: ' + dados.nome.trim() + '.') +
      '<button class="btn sec2" style="margin-top:10px" data-a="tentar">Voltar ao pedido</button></div>';
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
  /* ---------- Pix copia e cola (BR Code estático) ---------- */
  function crc16(s){
    var c = 0xFFFF;
    for (var i = 0; i < s.length; i++) {
      c ^= s.charCodeAt(i) << 8;
      for (var j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
    }
    return ('000' + c.toString(16).toUpperCase()).slice(-4);
  }
  function campoPix(id, v){ v = String(v); return id + ('0' + v.length).slice(-2) + v; }
  function semAcento(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9 ]/g, '').toUpperCase().trim(); }
  function pixPayload(valor, txid){
    var conta = campoPix('00', 'br.gov.bcb.pix') + campoPix('01', CFG.PIX.chave.trim());
    var p = campoPix('00', '01') + campoPix('01', '11') + campoPix('26', conta) + campoPix('52', '0000') + campoPix('53', '986') +
      campoPix('54', valor.toFixed(2)) + campoPix('58', 'BR') +
      campoPix('59', semAcento(CFG.PIX.titular).slice(0, 25)) + campoPix('60', semAcento(CFG.PIX.cidade).slice(0, 15)) +
      campoPix('62', campoPix('05', String(txid).replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***'));
    p += '6304';
    return p + crc16(p);
  }
  // Sistema novo: o serviço devolve a cobrança do PicPay (pixCopiaCola + pagamento = link da página do PicPay).
  // Pix em destaque (sem cadastro nem endereço); cartão como segunda opção, na página do PicPay.
  // O pagamento é confirmado sozinho (aviso do PicPay), sem comprovante.
  function htmlPagamentoPicPay(res, total){
    var link = /^https:\/\/link\.(picpay\.com|ppay\.me)\//.test(String(res.pagamento || '')) ? String(res.pagamento) : '';
    var h = '<div class="pix">';
    if (res.pixCopiaCola) {
      h += '<div class="sec">Pague com Pix</div><p class="nota" style="margin:0 0 8px">Copie o código abaixo e cole na opção "Pix copia e cola" do app do seu banco. O valor já vai preenchido. O Pix aparece em nome de <b>Arthur Orsi Consultoria Ltda</b>, a empresa do Tanuki Ramen.</p>';
      h += '<textarea id="pixcod" readonly rows="4" onclick="this.select()">' + esc(res.pixCopiaCola) + '</textarea>';
      h += '<button class="btn prim" style="margin-top:10px" data-a="copiar">Copiar código Pix</button>';
      h += '<p class="nota">Assim que o Pix cair, o pagamento é confirmado automaticamente e o pedido é registrado. Não precisa enviar comprovante. <b>Fique nesta tela.</b></p>';
    }
    if (link) {
      h += '<div class="sec" style="margin-top:16px">' + (res.pixCopiaCola ? 'Prefere cartão de crédito?' : 'Pagamento') + '</div>';
      h += '<a class="btn ' + (res.pixCopiaCola ? 'sec2' : 'prim') + '" style="margin-top:8px" target="_blank" rel="noopener" href="' + esc(link) + '">Pagar com cartão de crédito</a>';
      h += '<p class="nota">Abre a página segura do PicPay. Não precisa ter o app. No cartão, o PicPay pede <b>CPF, e-mail e endereço de cobrança</b>. Pagamento à vista.</p>';
    }
    h += linkWhats('Dúvidas? Fale com a gente no WhatsApp', 'Olá! Tenho uma dúvida sobre o pedido ' + String(res.ref || '').replace(/[^A-Za-z0-9]/g, '') + ' de ' + dados.nome.trim() + '.');
    return h + '</div>';
  }
  function htmlPagamento(res, total){
    if (res.pixCopiaCola || res.pagamento) return htmlPagamentoPicPay(res, total);
    if (!CFG.PIX.chave || !CFG.PIX.titular) return '<p>Entraremos em contato para o pagamento.</p>';
    // Código do pedido (TNK + 6 letras/números aleatórios, criado pelo serviço): vai no Pix e na mensagem do
    // comprovante para conferir o pagamento. Não é sequencial, então não revela quantos pedidos existem.
    var ref = String(res.ref || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 25);
    var codigo = pixPayload(total, ref || '***');
    var h = '<div class="pix"><div class="sec">Pague com Pix</div><p class="nota" style="margin:0 0 8px">Copie o código abaixo e cole na opção "Pix copia e cola" do app do seu banco. O valor já vai preenchido. O Pix aparece em nome de <b>Arthur Orsi Consultoria Ltda</b>, a empresa do Tanuki Ramen.</p>';
    h += '<textarea id="pixcod" readonly rows="4" onclick="this.select()">' + esc(codigo) + '</textarea>';
    h += '<button class="btn prim" style="margin-top:10px" data-a="copiar">Copiar código Pix</button>';
    h += '<p class="nota">Assim que o Pix cair, confirmamos o pagamento e registramos o pedido (leva de 1 a 2 minutos). Não precisa enviar comprovante. <b>Fique nesta tela.</b></p>';
    // Só aparece depois de 10 minutos sem confirmar (aguardarPagamento mostra #ajudaPix).
    h += '<div id="ajudaPix" hidden><p class="nota">Se passar de 10 minutos e não confirmar, fale com a gente:</p>' + linkWhats('Paguei e não confirmou', 'Olá! Paguei o Pix do pedido ' + (ref ? ref + ' ' : '') + 'de ' + dados.nome.trim() + ', valor ' + brl(total) + ', e ainda não confirmou.') + '</div>';
    return h + '</div>';
  }
  function copiarPix(b){
    var t = $('pixcod'); if (!t) return;
    t.select(); t.setSelectionRange(0, 99999);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    if (!ok && navigator.clipboard) { navigator.clipboard.writeText(t.value).then(function(){ b.textContent = 'Código copiado ✓'; }); return; }
    b.textContent = ok ? 'Código copiado ✓' : 'Selecione o código e copie';
  }

  // A página pergunta ao serviço a cada 5 s se o pagamento já foi confirmado (o pedido só entra nas planilhas depois disso).
  var pollTimer = null;
  function pararEspera(){ if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  function mostrarAjuda(ref){
    var a = $('ajudaPix'); if (a) a.hidden = false;
    var e = $('aguardando'); if (e) e.textContent = 'Ainda não confirmou. Se já pagou, fale com a gente:';
  }
  function aguardarPagamento(ref){
    pararEspera();
    var n = 0;
    pollTimer = setInterval(function(){
      n++;
      if (n === 120) mostrarAjuda(ref);                // 10 minutos sem confirmar: aparece o botão do WhatsApp
      if (n > 600) { pararEspera(); return; }          // 50 minutos
      if (document.hidden && n % 4) return;            // aba em segundo plano: pergunta menos
      fetch(CFG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({acao:'pago', ref: ref})})
        .then(function(r){ return r.json(); })
        .then(function(j){ if (j && j.pago === true) { pararEspera(); pagoOk(ref); } })
        .catch(function(){});
    }, 5000);
  }
  function pagoOk(ref){
    try { sessionStorage.removeItem('tanuki_ref_pend'); } catch(e){}
    var base = modo ? modo.ref : ref;
    var h = '<div class="msg ok"><h2>Pagamento confirmado!</h2>';
    if (ultimaRes && ultimaRes.ref === ref) h += '<div class="valor">' + brl(Number(ultimaRes.total)) + '</div>';
    h += '<p>' + (modo ? 'Seu complemento' : 'Seu pedido') + ' <b>' + esc(ref) + '</b> foi registrado. Obrigado!</p>';
    if (ultimaRes && ultimaRes.ref === ref) h += '<ul class="resumo">' + resumoItens() + '</ul><p style="margin-top:14px">' + frase() + '</p>';
    else h += '<p style="margin-top:14px">A data e o local da retirada estão na confirmação do seu pedido.</p>';
    h += '<div class="card" style="margin-top:14px"><div class="sec">Esqueceu algo?</div><p class="nota">Você pode adicionar itens a este pedido (pagos à parte) até o prazo da rodada. Guarde o número <b>' + esc(base) + '</b>: com ele e o seu telefone você volta aqui, ou abra <b>' + esc(location.origin + location.pathname + '?complemento=' + base) + '</b>.</p>';
    if (ultimaRes && ultimaRes.ref === ref) h += '<button class="btn sec2" style="margin-top:8px" data-a="complementar">Adicionar itens a este pedido</button>';
    h += '</div></div>';
    $('tela').innerHTML = h;
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function sucesso(res){
    try { sessionStorage.removeItem('tanuki_id_pedido'); } catch(e){}
    enviando = false;
    var total = Number(res.total);
    if (Math.abs(total - totalPedido()) > 0.001 && window.console) console.warn('Total da tela (' + totalPedido() + ') difere do serviço (' + total + '); vale o do serviço.');
    ultimaRes = res; substituiRef = '';
    try { sessionStorage.setItem('tanuki_ref_pend', res.ref); } catch(e){}
    $('tela').innerHTML = '<div class="msg ok"><h2>Estamos quase lá!</h2><p><b>Falta só o pagamento.</b> ' + (modo ? 'Seu complemento' : 'Seu pedido') + ' só é registrado quando o pagamento for confirmado.</p>' +
      '<div class="valor">' + brl(total) + '</div>' + htmlPagamento(res, total) +
      '<p class="nota" id="aguardando" style="margin-top:12px">⏳ Aguardando o Pix… (leva de 1 a 2 minutos)</p>' +
      '<ul class="resumo">' + resumoItens() + '</ul></div>';
    aguardarPagamento(res.ref);
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
  var ultimoCorpo = null;  // último pedido enviado; "Tentar de novo" (sem resposta) reenvia exatamente este
  function enviarPedido(reenvio){
    if (enviando) return;
    var corpo;
    if (reenvio && ultimoCorpo) {
      corpo = ultimoCorpo;
    } else {
      var tot = totaisOni();
      for (var k in tot) if (tot[k] > CFG.MAX_ONIGIRI) { alert('No máximo ' + CFG.MAX_ONIGIRI + ' onigiris de cada sabor. Ajuste a quantidade.'); return; }
      corpo = {
        id: idPedido, nome: dados.nome, telefone: dados.tel, obs: dados.obs, origem: origem, ciente: true,
        pokes: units.filter(function(u){ return u.t === 'poke'; }).map(function(u){ return {sabor: u.sabor, vinagrete: u.vin, adicionais: soPositivos(u.ad)}; }),
        onigiris: tot,
        acompanhamentos: contar('oni') ? soPositivos(extras.acomp) : {},
        sobremesas: soPositivos(extras.sob)
      };
      if (substituiRef && !modo) corpo.substitui = substituiRef;
      if (modo) { delete corpo.nome; corpo.acao = 'complemento'; corpo.ref = modo.ref; corpo.telefone = modo.tel; corpo.id = idComp; corpo.origem = 'complemento'; }
    }
    ultimoCorpo = corpo;
    enviando = true;
    var b = $('btnConfirmar') || $('btnReenviar'); if (b) { b.disabled = true; b.textContent = 'Enviando…'; }
    // Até 3 tentativas com o MESMO número de pedido: se a primeira demorou mas o Google gravou, a segunda
    // recebe de volta o mesmo pedido (o serviço não duplica). Só desiste depois de todas.
    function tentar(n){
      if (b) b.textContent = n === 1 ? 'Enviando…' : 'Ainda enviando… não feche esta tela';
      var ctl = new AbortController(); var t = setTimeout(function(){ ctl.abort(); }, 45000);
      fetch(CFG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(corpo), signal: ctl.signal})
        .then(function(r){ return r.json(); })
        .then(function(j){
          clearTimeout(t);
          if (j && j.ok === true) { sucesso(j); return; }
          if (j && j.codigo === 'validacao') { enviando = false; if (b) { b.disabled = false; b.textContent = 'Enviar pedido · ' + brl(totalPedido()); } alert(j.mensagem); return; }
          if (j && j.codigo === 'fechado') { enviando = false; mostrarEstado('<h2>Pedidos fechados</h2><p>Os pedidos não estão abertos agora.</p>'); return; }
          if (j && j.codigo === 'existente') { existente(j); return; }
          if (j && j.codigo === 'pendente') { pendente(j); return; }
          if (j && (j.codigo === 'limite' || j.codigo === 'conflito' || j.codigo === 'prazo' || j.codigo === 'complemento' || j.codigo === 'nao_encontrado' || j.codigo === 'bloqueado')) { recusado(j.mensagem); return; }
          if (j && j.codigo === 'ocupado' && n < 3) { tentar(n + 1); return; }
          falhaEnvio(false);
        })
        .catch(function(){ clearTimeout(t); if (n < 3) tentar(n + 1); else falhaEnvio(true); });
    }
    tentar(1);
  }

  document.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-a]'); if (!b || b.disabled || enviando) return;
    var a = b.getAttribute('data-a');
    lerDados();
    var iu = unidadeDe(tela), u = iu >= 0 ? units[iu] : null;

    if (a === 'novo') {
      if (tela === 'dados') {
        var d = dadosOk(); document.getElementById('g-nome').classList.toggle('tem-erro', !d.nome); document.getElementById('g-tel').classList.toggle('tem-erro', !d.tel);
        if (!d.ok) return;
      } else if (u && !unidadeOk(u)) { mostrarErrosUnidade(u); return; }
      novaUnidade(b.getAttribute('data-t'));
    }
    else if (a === 'continuar') {
      var d2 = dadosOk(); $('g-nome').classList.toggle('tem-erro', !d2.nome); $('g-tel').classList.toggle('tem-erro', !d2.tel);
      if (d2.ok) ir(primeiraTela(units.length - 1));
    }
    else if (a === 'voltar') { var ps = passos(), at = ps.indexOf(tela); ir(at > 0 ? ps[at - 1] : (modo ? 'comp' : 'dados')); }
    else if (a === 'remover') {
      units.splice(iu, 1);
      ir(units.length ? primeiraTela(Math.min(iu, units.length - 1)) : (modo ? 'comp' : 'dados'));
    }
    else if (a === 'sabor') { u.sabor = b.getAttribute('data-k'); render(); }
    else if (a === 'vin') { u.vin = (b.getAttribute('data-k') === 'true'); render(); }
    else if (a === 'avancar') { if (!unidadeOk(u)) { mostrarErrosUnidade(u); return; } ir('u' + iu + 'b'); }
    else if (a === 'ad') { var k = b.getAttribute('data-k'); if (u.ad[k]) delete u.ad[k]; else u.ad[k] = 1; render(); }
    else if (a === 'q') {
      // − / + dos adicionais com quantidade, acompanhamentos e sobremesa
      var g = b.getAttribute('data-g'), kq = b.getAttribute('data-k');
      var lista = g === 'ad' ? CFG.ADICIONAIS : g === 'acomp' ? CFG.ACOMP : CFG.SOBREMESAS;
      var alvo = g === 'ad' ? u.ad : extras[g];
      var item = lista.filter(function(x){ return x.k === kq; })[0]; if (!item || !alvo) return;
      var nq = Math.max(0, Math.min(item.max, (alvo[kq] || 0) + (+b.getAttribute('data-d'))));
      if (nq) alvo[kq] = nq; else delete alvo[kq];
      render();
    }
    else if (a === 'qtd') { u.qtd = Math.max(1, Math.min(CFG.MAX_ONIGIRI, u.qtd + (+b.getAttribute('data-d')))); render(); }
    else if (a === 'seguir') {
      if (u && !unidadeOk(u)) { mostrarErrosUnidade(u); return; }
      var ruim = primeiraInvalida();
      if (ruim >= 0) { ir(primeiraTela(ruim)); setTimeout(function(){ mostrarErrosUnidade(units[ruim]); }, 50); return; }
      ir(depoisDosItens());
    }
    else if (a === 'prox') { var ps2 = passos(); ir(ps2[ps2.indexOf(tela) + 1] || 'final'); }
    else if (a === 'confirmar') {
      var okc = dados.ciente; $('e-ciente').style.display = okc ? 'none' : 'block';
      if (!okc) { $('g-ciente').scrollIntoView({behavior:'smooth', block:'center'}); return; }
      enviarPedido();
    }
    else if (a === 'tentar') { ir('final'); }
    else if (a === 'retomarpag') { retomarServico(pendRef, dados.tel, function(j){ carregarCorpo(j.corpo); sucesso(j); }); }
    else if (a === 'retomaralt') {
      retomarServico(pendRef, dados.tel, function(j){
        if (!j.corpo) { alert('Este pedido é grande demais para alterar aqui. Volte ao pagamento ou fale com a gente pelo WhatsApp.'); return; }
        carregarCorpo(j.corpo); substituiRef = j.ref; ir('final');
      });
    }
    else if (a === 'outro') { ultimoCorpo.ignorarPendente = true; enviarPedido(true); }
    else if (a === 'segundo') { ultimoCorpo.segundoPedido = true; enviarPedido(true); }
    else if (a === 'acessar') { ir('acesso'); }
    else if (a === 'voltardados') { modo = null; refPre = ''; ir('dados'); }
    else if (a === 'continuarc') { ir(primeiraTela(units.length - 1)); }
    else if (a === 'consultar' || a === 'atualizar') {
      var rr = a === 'atualizar' ? modo.ref : ($('refc').value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), tt = a === 'atualizar' ? modo.tel : dados.tel, er = $('erro-acesso');
      var mostra = function(m){ if (er) { er.textContent = m; er.style.display = 'block'; } else alert(m); b.disabled = false; };
      if (a === 'consultar' && (!rr || !foneOk(tt))) { mostra(!rr ? 'Informe o número do pedido.' : 'Telefone inválido. Use DDD + número.'); return; }
      b.disabled = true; enviando = true;
      consultarPedido(rr, tt, mostra);
    }
    else if (a === 'complementar') {
      // depois do pagamento do pedido novo: entra no modo complemento com o número e o telefone que acabaram de ser usados
      var rc = modo ? modo.ref : ((ultimaRes && ultimaRes.ref) || ''), tc = modo ? modo.tel : dados.tel;
      units = []; extras = {acomp:{}, sob:{}}; b.disabled = true; enviando = true;
      consultarPedido(rc, tc, function(m){ enviando = false; b.disabled = false; alert(m); });
    }
    else if (a === 'reenviar') { b.id = 'btnReenviar'; enviarPedido(true); }
    else if (a === 'copiar') { copiarPix(b); }
    else if (a === 'novopedido') { try { sessionStorage.removeItem('tanuki_ref_pend'); } catch(e){} pararEspera(); carregar(); }
  });

  document.addEventListener('input', function(ev){
    if (ev.target.id !== 'tel') return;
    // digitosTel tira o +55 e o 0 (o preenchimento automático do celular costuma mandar "+55 49 9...").
    var d = digitosTel(ev.target.value).slice(0, 11), s = d, c = d.length > 10 ? 7 : 6;
    if (d.length > 2) s = '(' + d.slice(0,2) + ') ' + d.slice(2, c) + (d.length > c ? '-' + d.slice(c) : '');
    ev.target.value = s;
  });

  // Volta da página do PicPay depois de pagar no cartão (redirect_url do serviço termina com ?pago=1).
  if (new URLSearchParams(location.search).get('pago') === '1') {
    try { sessionStorage.removeItem('tanuki_id_pedido'); } catch(e){}
    mostrarEstado('<h2>Pagamento enviado!</h2><p>Recebemos a volta da página do PicPay. Seu pedido é registrado assim que o pagamento for confirmado. A data e o local da retirada estão na confirmação do seu pedido. Obrigado!</p>' +
      '<p class="nota" id="aguardando">⏳ Aguardando a confirmação do pagamento…</p>' +
      linkWhats('Dúvidas? Fale com a gente no WhatsApp', 'Olá! Paguei meu pedido no cartão e tenho uma dúvida.'), 'ok');
    var refPend = ''; try { refPend = sessionStorage.getItem('tanuki_ref_pend') || ''; } catch(e){}
    if (refPend) aguardarPagamento(refPend);
  } else if (CFG.API_URL.indexOf('COLE_AQUI') === 0) {
    mostrarEstado('<h2>Página ainda não configurada</h2><p>Falta ligar o serviço de pedidos.</p>' + linkForms('Abrir o formulário de pedidos'), 'falha');
  } else {
    // Recarregou a página (ex.: voltou do app do banco) com um Pix ainda não confirmado: retoma a espera.
    var pendPag = ''; try { pendPag = sessionStorage.getItem('tanuki_ref_pend') || ''; } catch(e){}
    if (pendPag) {
      var refTxt = pendPag.replace(/[^A-Za-z0-9]/g, '');
      mostrarEstado('<h2>Aguardando o pagamento</h2><p id="aguardando">Aguardando a confirmação do Pix do pedido <b>' + esc(refTxt) + '</b>…</p>' +
        '<p class="nota">Se você já pagou, fique nesta tela. Confirma sozinho em 1 a 2 minutos.</p>' +
        '<div id="ajudaPix" hidden><p class="nota">Se passar de 10 minutos e não confirmar, fale com a gente:</p>' +
        linkWhats('Paguei e não confirmou', 'Olá! Paguei o Pix do pedido ' + refTxt + ' e ainda não confirmou.') + '</div>' +
        '<button class="btn sec2" style="margin-top:14px" data-a="novopedido">Fazer um pedido novo</button>', 'aviso');
      aguardarPagamento(pendPag);
    } else carregar();
  }
})();
</script>
</body>
